<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña · Mercado Norte Sur</title>
<link rel="icon" href="../assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="../assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>
/* ============================================================
   Mercado Norte Sur — Design system compartido
   Tokens, tipografía y componentes reutilizados en todas las páginas.
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');

:root{
  --bg: #FFFFFF;
  --bg-subtle: #F6F4EF;
  --ink: #1B1A17;
  --ink-soft: #635E55;
  --ink-faint: #96907F;
  --rust: #27D3F5;
  --rust-dark: #00AFCF;
  --rust-soft: #E8FAFE;
  --forest: #F5AD27;
  --forest-soft: #FFF0C2;
  --amber: #9A6B12;
  --amber-soft: #FBEED2;
  --red: #B3261E;
  --red-soft: #FBE2E0;
  --line: #E7E2D8;
  --card-bg: #FFFFFF;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(27,26,23,0.04), 0 8px 24px rgba(27,26,23,0.05);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Roboto', -apple-system, sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none; cursor:pointer;}
ul{list-style:none; margin:0; padding:0;}
img{max-width:100%; display:block;}
button{font-family:inherit;}

.price{font-family:'Roboto', sans-serif; font-weight:600; letter-spacing:-0.01em;}
.eyebrow{
  font-family:'Roboto', sans-serif;
  font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
  color:var(--ink-faint); font-weight:600;
}
h1,h2,h3{font-family:'Roboto', sans-serif; margin:0; letter-spacing:-0.01em;}

.wrap{max-width:1280px; margin:0 auto; padding:0 32px;}

/* ---------- LOGO ---------- */
.logo{display:flex; align-items:center; gap:9px; font-weight:700; font-size:18px; flex-shrink:0;}
.logo-mark{
  width:30px; height:30px; border-radius:8px; background:var(--rust);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}

/* ---------- HEADER (público / app) ---------- */
header.site{
  position:sticky; top:0; z-index:50;
  background:rgba(255,255,255,0.94); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.header-top{
  display:flex; align-items:center; gap:28px; padding:14px 32px;
  max-width:1280px; margin:0 auto;
}
.search-bar{
  flex:1; display:flex; align-items:center;
  background:var(--bg-subtle); border:1px solid var(--line); border-radius:8px;
  padding:0 14px; height:42px; max-width:620px;
}
.search-bar input{
  border:none; background:transparent; outline:none;
  font-family:'Roboto',sans-serif; font-size:14px; flex:1; color:var(--ink);
}
.search-bar input::placeholder{color:var(--ink-faint);}
.header-actions{display:flex; align-items:center; gap:18px; flex-shrink:0;}
.icon-btn{display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600; color:var(--ink); position:relative;}
.cart-dot{
  position:absolute; top:-6px; right:-9px; background:var(--rust); color:#1B1A17;
  font-size:9.5px; font-weight:700; width:15px; height:15px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}

/* Avatar / user menu */
.user-menu{position:relative;}
.avatar-btn{
  display:flex; align-items:center; gap:8px; padding:6px 10px 6px 6px;
  border:1px solid var(--line); border-radius:100px; background:#fff;
}
.avatar{
  width:26px; height:26px; border-radius:50%; background:var(--forest); color:#1B1A17;
  display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;
}
.avatar-name{font-size:13px; font-weight:600;}
.dropdown{
  position:absolute; top:44px; right:0; background:#fff; border:1px solid var(--line);
  border-radius:10px; box-shadow:var(--shadow); min-width:210px; padding:6px; display:none; z-index:60;
}
.dropdown.open{display:block;}
.dropdown a, .dropdown button{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:9px 10px; font-size:13.5px; font-weight:500; border-radius:7px; border:none; background:none;
}
.dropdown a:hover, .dropdown button:hover{background:var(--bg-subtle);}
.dropdown hr{border:none; border-top:1px solid var(--line); margin:5px 2px;}

.cat-nav{
  border-top:1px solid var(--line); display:flex; align-items:center; gap:2px;
  max-width:1280px; margin:0 auto; padding:0 32px; overflow-x:auto;
}
.cat-nav a{
  font-size:13px; font-weight:600; color:var(--ink-soft); padding:11px 14px; white-space:nowrap;
  border-bottom:2px solid transparent; transition:color .15s ease, border-color .15s ease;
}
.cat-nav a:hover{color:var(--rust); border-color:var(--rust);}
.cat-nav a.active{color:var(--ink); border-color:var(--ink);}

/* ---------- BUTTONS ---------- */
.btn-primary, .btn-sell{
  background:var(--rust); color:#1B1A17; font-weight:700; font-size:13.5px;
  padding:11px 18px; border-radius:7px; display:inline-flex; align-items:center; gap:8px;
  border:none; cursor:pointer; transition:background .15s ease;
}
.btn-primary:hover, .btn-sell:hover{background:var(--rust-dark);}
.btn-ghost{
  background:transparent; color:var(--ink); font-weight:700; font-size:13.5px;
  padding:11px 18px; border-radius:7px; border:1.5px solid var(--ink); cursor:pointer;
}
.btn-ghost:hover{background:var(--bg-subtle);}
.btn-google{
  display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
  padding:11px 16px; border:1px solid var(--line); border-radius:7px; background:#fff;
  font-weight:600; font-size:13.5px; cursor:pointer; transition:background .15s ease, box-shadow .15s ease;
}
.btn-google:hover{box-shadow:var(--shadow);}
.btn-danger{
  background:var(--red-soft); color:var(--red); font-weight:700; font-size:13px;
  padding:9px 14px; border-radius:7px; border:none; cursor:pointer;
}
.btn-approve{
  background:var(--forest); color:#1B1A17; font-weight:700; font-size:13px;
  padding:9px 14px; border-radius:7px; border:none; cursor:pointer;
}
.btn-sm{padding:7px 12px; font-size:12.5px;}
.link-rust{color:var(--rust); font-weight:600; font-size:13.5px;}

/* ---------- BADGES / STATUS ---------- */
.badge{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
  font-family:'Roboto',sans-serif; padding:4px 9px; border-radius:5px; letter-spacing:0.02em;
}
.badge.aprobado{background:var(--forest-soft); color:#1B1A17;}
.badge.revision{background:var(--amber-soft); color:var(--amber);}
.badge.rechazado{background:var(--red-soft); color:var(--red);}
.badge.nuevo{background:var(--forest-soft); color:#1B1A17;}
.badge.usado{background:#EFE9DA; color:var(--ink-soft);}

/* ---------- CARDS / TABLE / TABS ---------- */
.card{
  border:1px solid var(--line); border-radius:var(--radius); background:#fff; padding:20px;
}
.section-head{
  display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; gap:16px;
}
.section-head h2{font-size:22px;}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:24px;}
.tab{
  padding:11px 4px; margin-right:22px; font-size:13.5px; font-weight:700; color:var(--ink-faint);
  border-bottom:2px solid transparent; cursor:pointer; background:none; border-top:none; border-left:none; border-right:none;
}
.tab.active{color:var(--ink); border-color:var(--rust);}

table.data-table{width:100%; border-collapse:collapse; font-size:13.5px;}
.data-table th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
  color:var(--ink-faint); font-weight:700; padding:0 12px 10px; border-bottom:1px solid var(--line);
}
.data-table td{padding:14px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
.data-table tr:last-child td{border-bottom:none;}
.row-prod{display:flex; align-items:center; gap:10px;}
.row-thumb{width:42px; height:42px; border-radius:7px; object-fit:cover; background:var(--bg-subtle); flex-shrink:0;}

.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
.stat-box{border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;}
.stat-box .num{font-family:'Roboto',sans-serif; font-size:26px;}
.stat-box .lbl{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

.empty-state{
  border:1px dashed var(--line); border-radius:var(--radius); padding:44px 20px;
  text-align:center; color:var(--ink-soft); font-size:14px;
}

/* ---------- FORMS ---------- */
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:700; margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; border:1px solid var(--line); border-radius:7px; padding:10px 12px;
  font-family:'Roboto',sans-serif; font-size:14px; color:var(--ink); background:#fff; outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--rust);}
.field .hint{font-size:11.5px; color:var(--ink-faint); margin-top:5px;}
.divider-or{
  display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--ink-faint); font-size:12px; font-weight:600;
}
.divider-or::before, .divider-or::after{content:''; flex:1; height:1px; background:var(--line);}

.pill-toggle{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
.pill-toggle button{
  flex:1; padding:10px; font-size:13px; font-weight:600; border:none; background:#fff; color:var(--ink-soft); cursor:pointer;
}
.pill-toggle button.on{background:var(--ink); color:#1B1A17;}

/* ---------- TOAST ---------- */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#1B1A17; padding:12px 20px; border-radius:8px; font-size:13.5px; font-weight:600;
  opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:200;
  display:flex; align-items:center; gap:10px;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- FOOTER ---------- */
footer.site{background:var(--forest); color:#1B1A17; padding:40px 0 24px; margin-top:60px;}
footer.site .wrap{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#51401F; flex-wrap:wrap; gap:10px;}
footer.site a{color:#1B1A17;}

@media (max-width:960px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
}

</style>
<style>
  .auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg-subtle); padding:24px;}
  .auth-card{width:100%; max-width:400px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:32px 28px; box-shadow:var(--shadow);}
  .auth-card .logo{justify-content:center; margin-bottom:22px;}
  .auth-card h1{font-size:22px; text-align:center; margin-bottom:6px;}
  .auth-card .sub{text-align:center; font-size:13px; color:var(--ink-soft); margin-bottom:22px; line-height:1.5;}
  .foot-link{text-align:center; font-size:13px; color:var(--ink-soft); margin-top:18px;}
  #successState{display:none; text-align:center;}
  .check-circle{
    width:52px; height:52px; border-radius:50%; background:var(--forest-soft); color:#1B1A17;
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px;
  }

  @media (max-width:480px){
    .auth-wrap{padding:14px;}
    .auth-card{padding:24px 18px; border-radius:12px;}
  }

  .form-error{
    display:none; background:#FBE2E0; color:#B3261E; border-radius:8px; padding:10px 12px;
    font-size:12.5px; font-weight:500; line-height:1.4; margin:0 0 14px;
  }
  .btn-google[disabled], .btn-primary[disabled]{opacity:.6; cursor:progress;}
</style>
<style>
body{font-size:15.5px;line-height:1.55}.page-head h1{font-size:28px}.page-head .sub{font-size:15px}.stat-box .lbl,.field label{font-size:13.5px}
@media(max-width:680px){body{font-size:16px}.wrap{padding-left:16px;padding-right:16px}.page-head h1{font-size:23px}.page-head .sub{font-size:14.5px;line-height:1.5}.header-top{gap:10px;flex-wrap:wrap}.header-actions{gap:8px}.btn-sell{font-size:13.5px;min-height:42px}.stat-box .lbl{font-size:12.5px;line-height:1.35}.tab{font-size:14px;padding:12px 4px}.fav-grid{gap:10px}.fav-body .n{font-size:14px;line-height:1.4}.table-scroll{max-width:100%}}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card" id="formState">
    <a href="../index.html" class="logo">
      <span class="logo-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 20L9 8L13 15L16 10L21 20H3Z" fill="white"/></svg></span>
      Mercado Norte Sur
    </a>
    <h1>Recupera tu contraseña</h1>
    <div class="sub">Ingresa el correo de tu cuenta y te enviaremos un enlace para crear una nueva contraseña.</div>

    <form id="forgotForm" novalidate>
      <div class="field">
        <label>Correo electrónico</label>
        <input type="email" id="emailInput" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
      </div>
      <div class="form-error" id="formError" role="alert"></div>
      <button type="submit" class="btn-primary" id="submitBtn" style="width:100%; justify-content:center;">Enviar enlace de recuperación</button>
    </form>
    <div class="foot-link"><a href="login.html" class="link-rust">← Volver a iniciar sesión</a></div>
  </div>

  <div class="auth-card" id="successState">
    <div class="check-circle">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1>Revisa tu correo</h1>
    <div class="sub">Enviamos un enlace para restablecer tu contraseña a <b id="emailShown" style="color:var(--ink);"></b>. Si no lo ves, revisa tu carpeta de spam.</div>
    <button class="btn-ghost" id="resendBtn" type="button" style="width:100%; justify-content:center;">Reenviar enlace</button>
    <div class="sub" id="resendMsg" style="margin:10px 0 0; font-size:12px;"></div>
    <div class="foot-link"><a href="login.html" class="link-rust">← Volver a iniciar sesión</a></div>
  </div>
</div>
<script type="module">
  import { resetPassword, friendlyError } from "../assets/firebase.js";

  const errBox = document.getElementById('formError');
  const submitBtn = document.getElementById('submitBtn');
  const emailInput = document.getElementById('emailInput');
  const showError = (m) => { errBox.textContent = m || ''; errBox.style.display = m ? 'block' : 'none'; };

  // Por seguridad no revelamos si el correo existe o no: si no existe, igual mostramos éxito
  async function send(email) {
    try { await resetPassword(email); }
    catch (err) { if (err.code !== 'auth/user-not-found') throw err; }
  }

  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    showError('');
    const email = emailInput.value.trim();
    if (!email) { showError('Ingresa tu correo.'); return; }
    submitBtn.disabled = true;
    try {
      await send(email);
      document.getElementById('emailShown').textContent = email;
      document.getElementById('formState').style.display = 'none';
      document.getElementById('successState').style.display = 'block';
    } catch (err) {
      showError(friendlyError(err));
    } finally {
      submitBtn.disabled = false;
    }
  });

  document.getElementById('resendBtn').addEventListener('click', async (e) => {
    const btn = e.currentTarget, msg = document.getElementById('resendMsg');
    btn.disabled = true; msg.textContent = '';
    try { await send(emailInput.value.trim()); msg.textContent = 'Enlace reenviado.'; }
    catch (err) { msg.textContent = friendlyError(err); }
    setTimeout(() => { btn.disabled = false; }, 15000);
  });
</script>
</body>
</html>
