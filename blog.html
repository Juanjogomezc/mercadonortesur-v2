<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#27D3F5"><title>Blog · Mercado Norte Sur</title><link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#F6F4EF;color:#1B1A17;font:16px/1.6 Roboto,Arial,sans-serif}a{color:inherit;text-decoration:none}.top{background:#fff;border-bottom:1px solid #E7E2D8;padding:16px 24px}.top a{font-weight:800}.mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#27D3F5;color:#fff;margin-right:8px}.wrap{max-width:1120px;margin:0 auto;padding:42px 24px}.eyebrow{color:#00AFCF;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}h1{font-size:42px;line-height:1.1;margin:8px 0}header p{color:#635E55;margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid #E7E2D8;border-radius:12px;overflow:hidden}.card img{width:100%;aspect-ratio:16/9;object-fit:cover}.body{padding:18px}.cat{color:#00AFCF;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.body h2{font-size:20px;line-height:1.3;margin:8px 0}.body p{font-size:14px;color:#635E55}.meta{font-size:12px;color:#96907F}.empty{padding:35px;background:white;border:1px dashed #E7E2D8;border-radius:12px;text-align:center;color:#635E55}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:34px}}@media(max-width:540px){.grid{grid-template-columns:1fr}.wrap{padding:30px 16px}}</style></head>
<body><div class="top"><a href="index.html"><span class="mark">▲</span>Mercado Norte Sur</a></div><main class="wrap"><header><span class="eyebrow">Comunidad y conocimiento</span><h1>Blog Mercado Norte Sur</h1><p>Reseñas, guías, cursos, consejos y novedades para tu próxima aventura.</p></header><div class="grid" id="blogList"><div class="empty">Cargando contenidos…</div></div></main>
<script type="module">
import {fetchPublishedBlogPosts,safeUrl,esc} from "./assets/firebase.js";
const list=document.getElementById("blogList");
const date=v=>{const d=v?.toDate?v.toDate():v?new Date(v):null;return d&&!Number.isNaN(d.getTime())?d.toLocaleDateString("es-CL"):"";};
try{const posts=await fetchPublishedBlogPosts(100);list.innerHTML=posts.length?posts.map(p=>'<a class="card" href="blog-post.html?slug='+encodeURIComponent(p.slug)+'">'+(safeUrl(p.coverImage)?'<img src="'+esc(p.coverImage)+'" alt="'+esc(p.title)+'">':'')+'<div class="body"><span class="cat">'+esc(p.category||"Blog")+'</span><h2>'+esc(p.title)+'</h2><p>'+esc(p.excerpt||"")+'</p><div class="meta">'+date(p.publishedAt||p.createdAt)+' · '+Math.max(1,Number(p.readingTime)||1)+' min de lectura</div></div></a>').join(""):'<div class="empty">Todavía no hay artículos publicados. Vuelve pronto.</div>';}catch(e){list.innerHTML='<div class="empty">No pudimos cargar el Blog. Inténtalo más tarde.</div>';console.error(e);}
</script></body></html>
