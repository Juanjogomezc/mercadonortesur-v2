<!DOCTYPE html>
<html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Producto · Mercado Norte Sur</title><link rel="icon" href="assets/favicon.ico"><link rel="stylesheet" href="assets/styles.css">
<style>
.product-page{padding:28px 32px 70px}.product-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:38px;align-items:start}.product-gallery{min-width:0}.product-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.product-thumbs button{width:66px;height:66px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;cursor:pointer}.product-thumbs button.active{border:2px solid var(--rust)}.product-thumbs img{width:100%;height:100%;object-fit:cover}.product-photo{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:var(--bg-subtle)}.product-info{position:sticky;top:100px}.product-title{font-size:32px;line-height:1.18;margin:8px 0 14px}.product-price{font-size:32px;margin:14px 0}.product-old{font-size:16px;color:var(--ink-faint);text-decoration:line-through;margin-left:10px}.product-meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.product-tag{padding:6px 10px;border-radius:20px;background:var(--bg-subtle);font-size:12px;color:var(--ink-soft)}.seller-card{border:1px solid var(--line);border-radius:10px;padding:16px;margin:22px 0}.seller-row{display:flex;align-items:center;gap:12px}.seller-avatar{width:42px;height:42px;border-radius:50%;background:var(--forest-soft);display:grid;place-items:center;color:#1B1A17;font-weight:700}.product-actions{display:grid;gap:10px;margin-top:18px}.contact-btn,.add-cart-btn,.favorite-btn{display:flex;justify-content:center;align-items:center;gap:9px;border-radius:8px;padding:14px 18px;font-weight:700;cursor:pointer}.contact-btn{background:var(--forest);color:white;border:0}.contact-btn:disabled{opacity:.55;cursor:not-allowed}.add-cart-btn{background:var(--rust);color:#fff;border:0}.favorite-btn{border:1px solid var(--line);background:#fff}.favorite-btn.is-favorite{color:var(--rust);border-color:var(--rust);background:var(--rust-soft)}.description{line-height:1.7;color:var(--ink-soft);white-space:pre-line;margin-top:12px}.detail-section{margin-top:30px}.detail-section h2{font-size:20px;margin-bottom:12px}.attribute-table{width:100%;border-collapse:collapse;font-size:13px}.attribute-table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}.attribute-table td:first-child{width:40%;font-weight:700;color:var(--ink-soft)}.notice{padding:12px;border-radius:8px;background:var(--bg-subtle);color:var(--ink-soft);font-size:13px;line-height:1.5;margin-top:10px}.seller-label{font-size:12px;color:var(--ink-soft);margin-top:3px}.loading{padding:60px 20px;text-align:center;color:var(--ink-soft)}
@media(max-width:760px){.product-page{padding:18px 16px 50px}.product-layout{grid-template-columns:1fr;gap:22px}.product-info{position:static}.product-title{font-size:26px}.header-top{padding:12px 16px}.header-actions{gap:12px}.header-actions a{font-size:12px}}

.product-photo-wrap{position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#F3F6F7}
.product-photo-wrap .product-photo{height:100%;border-radius:0}
.photo-placeholder{display:none;position:absolute;inset:0;place-items:center;color:var(--ink-soft);font-size:15px;text-align:center;padding:20px}
.product-thumbs button{width:76px;height:76px;flex:0 0 76px}
.product-thumbs button.active{border:2px solid var(--rust)}
.product-actions .share-btn{display:flex;justify-content:center;align-items:center;gap:9px;border-radius:8px;padding:13px 18px;font-size:15px;font-weight:700;min-height:48px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.share-panel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.share-panel[hidden]{display:none}
.share-panel a,.share-panel button{display:flex;align-items:center;justify-content:center;min-height:44px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:600 14px Roboto,sans-serif;text-align:center;cursor:pointer}
.share-panel a:hover,.share-panel button:hover{border-color:var(--rust);background:var(--rust-soft)}
@media(max-width:760px){
 .product-page{padding:16px 14px 44px}.product-layout{gap:20px}
 .product-title{font-size:28px;line-height:1.25}.product-price{font-size:29px}
 .product-tag{font-size:13px}.product-info{min-width:0}.seller-card{padding:14px;margin:18px 0}
 .description{font-size:16px;line-height:1.7}.detail-section h2{font-size:21px}
 .attribute-table{font-size:14px}.attribute-table td{padding:11px 9px}
 .header-top{gap:10px;flex-wrap:wrap;padding:10px 14px}
 .header-actions{width:100%;justify-content:space-between;gap:8px;flex-wrap:wrap}
 .header-actions a{font-size:13.5px;min-height:38px}.product-thumbs button{width:68px;height:68px;flex-basis:68px}
}
</style></head><body>
<header class="site"><div class="header-top"><a class="logo" href="index.html"><span class="logo-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 20L9 8L13 15L16 10L21 20H3Z" fill="white"/></svg></span>Mercado Norte Sur</a><div style="flex:1"></div><nav class="header-actions"><a href="index.html">Comprar</a><a href="cuenta/favoritos.html">Favoritos</a><a href="cuenta/carrito.html" class="icon-btn">Carrito <span class="cart-dot">0</span></a><a href="cuenta/dashboard.html">Mi cuenta</a></nav></div></header>
<main class="wrap product-page" id="app"><div class="loading">Cargando publicación…</div></main>
<script src="assets/app.js"></script>
<script type="module">
import {watchUser,fetchListing,fetchFavoriteIds,toggleFavorite,resolveListingImages,esc} from "./assets/firebase.js";
const root=document.getElementById("app"),id=new URLSearchParams(location.search).get("id");
const money=n=>"$"+Number(n||0).toLocaleString("es-CL");
let currentUser=null,currentProfile=null,authReady=false,saved=false,listing=null;
const categoryLabels={camping:"Camping",escalada:"Escalada",trekking:"Trekking",surf:"Surf",pesca:"Pesca",ciclismo:"Ciclismo",nieve:"Nieve",navegacion:"Navegación",servicios:"Servicios y arriendos"};
function contactState(){
 const btn=document.getElementById("contactBtn"),note=document.getElementById("contactNote");if(!btn||!listing)return;
 const phone=String(listing.contactPhone||"").replace(/\D/g,"");
 const adminOwned=listing.sellerType==="admin"||listing.adminCatalog;
 if(!phone){btn.style.display="none";note.textContent=adminOwned?"Este artículo está publicado por Mercado Norte Sur. El canal de contacto institucional aún no está configurado.":"El vendedor todavía no ha registrado un WhatsApp de contacto.";note.style.display="block";return}
 btn.style.display="flex";note.style.display="none";
 if(!authReady){btn.disabled=true;btn.textContent="Verificando tu cuenta…";return}
 if(!currentUser){btn.disabled=false;btn.textContent="Inicia sesión para contactar";return}
 if(!currentProfile||currentProfile.status!=="approved"){btn.disabled=true;btn.textContent=currentProfile?.status==="pending"?"Tu cuenta está en revisión": "Tu cuenta no está habilitada para contactar";return}
 btn.disabled=false;btn.textContent="Contactar por WhatsApp";
}
async function render(p){
 listing=p;
 const images=await resolveListingImages(p);
 const image=images[0]||"";
 const attrs=p.attributes&&typeof p.attributes==="object"?p.attributes:{};
 const seller=p.sellerName||"Vendedor";
 const isAdmin=p.sellerType==="admin"||p.adminCatalog;
 const condition=p.condition==="nuevo"?"Nuevo":p.condition==="servicio"?"Servicio":"Usado";
 const attributeRows=Object.entries({...attrs,Condición:condition,Ubicación:p.location||"No informada",Categoría:categoryLabels[p.category]||p.category||"Outdoor"}).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+esc(String(v??"No informado"))+'</td></tr>').join("");
 root.innerHTML=`<div class="product-layout"><div class="product-gallery"><div class="product-photo-wrap"><img id="mainProductImage" class="product-photo" src="${esc(image)}" alt="${esc(p.title)}" loading="eager" fetchpriority="high" decoding="async" onerror="this.style.display='none';document.getElementById('photoPlaceholder').style.display='grid'" ${image ? "" : "style=\"display:none\""}><div id="photoPlaceholder" class="photo-placeholder" style="${image ? "" : "display:grid"}">No pudimos cargar esta fotografía o aún no se han agregado fotos.</div></div><div id="productThumbs" class="product-thumbs"></div><section class="detail-section"><h2>Descripción</h2><p class="description">${esc(p.description||"El vendedor no agregó una descripción.")}</p></section><section class="detail-section"><h2>Características y atributos</h2><table class="attribute-table"><tbody>${attributeRows}</tbody></table></section></div>
 <div class="product-info"><div class="eyebrow">${esc(categoryLabels[p.category]||p.category||"Outdoor")} · ${esc(p.location||"Chile")}</div><h1 class="product-title">${esc(p.title)}</h1><div class="product-price price">${money(p.price)}${p.unit ? " / " + esc(p.unit) : ""}${p.oldPrice?'<span class="product-old">'+money(p.oldPrice)+'</span>':""}</div>
 <div class="product-meta"><span class="product-tag">${condition}</span><span class="product-tag">${esc(p.location||"Ubicación no indicada")}</span>${isAdmin?'<span class="product-tag">Publicado por Mercado Norte Sur</span>':""}</div>
 <div class="seller-card"><div class="seller-row"><div class="seller-avatar">${esc(seller.slice(0,1).toUpperCase())}</div><div><strong>${esc(seller)}</strong><div class="seller-label">${isAdmin?"Cuenta administradora de Mercado Norte Sur":"Vendedor en Mercado Norte Sur"}</div></div></div></div>
 <div class="product-actions"><button id="contactBtn" class="contact-btn" type="button">Verificando tu cuenta…</button><div id="contactNote" class="notice" style="display:none"></div><button id="addCartBtn" class="add-cart-btn" type="button">＋ Agregar al carrito</button><button id="favoriteBtn" class="favorite-btn" type="button">♡ Guardar en favoritos</button><button id="shareBtn" class="share-btn" type="button" aria-expanded="false">↗ Compartir publicación</button><div id="sharePanel" class="share-panel" hidden><a id="shareWhatsApp" target="_blank" rel="noopener">WhatsApp</a><a id="shareFacebook" target="_blank" rel="noopener">Facebook</a><a id="shareX" target="_blank" rel="noopener">X</a><button id="copyShareLink" type="button">Copiar enlace</button><button id="nativeShare" type="button" style="grid-column:1/-1">Más opciones para compartir</button></div></div></div></div>`;
 if(p.status!=="approved"){root.insertAdjacentHTML("afterbegin",'<div class="notice" style="margin-bottom:18px">Vista previa del vendedor: esta publicación todavía está pendiente de aprobación y no es visible para otros visitantes.</div>');}
 contactState();
 const thumbs=document.getElementById("productThumbs");
 thumbs.innerHTML=images.map((src,index) => "<button type=\"button\" data-gallery-src=\"" + esc(src) + "\" aria-label=\"Ver fotografía " + (index+1) + "\" class=\"" + (index===0?"active":"") + "\"><img src=\"" + esc(src) + "\" alt=\"Fotografía " + (index+1) + "\" loading=\"lazy\"></button>").join("");
 const mainImage=document.getElementById("mainProductImage"),placeholder=document.getElementById("photoPlaceholder");
 mainImage.addEventListener("error",()=>{mainImage.style.display="none";placeholder.style.display="grid"});
 mainImage.addEventListener("load",()=>{mainImage.style.display="block";placeholder.style.display="none"});
 thumbs.addEventListener("click",event=>{const button=event.target.closest("[data-gallery-src]");if(!button)return;mainImage.style.display="block";placeholder.style.display="none";mainImage.src=button.dataset.gallerySrc;thumbs.querySelectorAll("button").forEach(item=>item.classList.toggle("active",item===button))});
 const shareUrl=location.href,shareTitle=listing.title+" | Mercado Norte Sur";
 const shareBtn=document.getElementById("shareBtn"),sharePanel=document.getElementById("sharePanel");
 document.getElementById("shareWhatsApp").href="https://wa.me/?text="+encodeURIComponent(shareTitle+" "+shareUrl);
 document.getElementById("shareFacebook").href="https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(shareUrl);
 document.getElementById("shareX").href="https://twitter.com/intent/tweet?text="+encodeURIComponent(shareTitle)+"&url="+encodeURIComponent(shareUrl);
 shareBtn.addEventListener("click",()=>{const open=sharePanel.hidden;sharePanel.hidden=!open;shareBtn.setAttribute("aria-expanded",String(open))});
 document.getElementById("copyShareLink").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(shareUrl);document.getElementById("copyShareLink").textContent="Enlace copiado"}catch(_){window.prompt("Copia el enlace de esta publicación:",shareUrl)}});
 document.getElementById("nativeShare").addEventListener("click",async()=>{if(navigator.share){try{await navigator.share({title:shareTitle,text:"Mira esta publicación en Mercado Norte Sur",url:shareUrl})}catch(e){if(e.name!=="AbortError")alert("No fue posible abrir las opciones para compartir.")}}else{try{await navigator.clipboard.writeText(shareUrl);alert("Enlace copiado.")}catch(_){window.prompt("Copia el enlace:",shareUrl)}}});

 document.getElementById("contactBtn").addEventListener("click",()=>{
   if(!currentUser){const next=location.pathname+location.search;location.href="auth/login.html?next="+encodeURIComponent(next);return}
   if(!currentProfile||currentProfile.status!=="approved"){contactState();return}
   const phone=String(listing.contactPhone||"").replace(/\D/g,"");if(!phone)return;
   const target=phone.length===9?"56"+phone:phone;
   const msg="Hola, vi tu publicación «"+listing.title+"» en Mercado Norte Sur y me interesa. ¿Está disponible? "+location.href;
   window.open("https://wa.me/"+target+"?text="+encodeURIComponent(msg),"_blank","noopener");
 });
 document.getElementById("addCartBtn").addEventListener("click",()=>{
   if(MNS.addToCart({id:listing.id,name:listing.title,price:listing.price,image,seller,category:listing.category,location:listing.location})){
     const b=document.getElementById("addCartBtn");b.textContent="✓ Agregado al carrito";b.disabled=true;setTimeout(()=>{b.textContent="＋ Agregar al carrito";b.disabled=false},1200);
   }
 });
 const fav=document.getElementById("favoriteBtn");
 const sync=()=>{fav.classList.toggle("is-favorite",saved);fav.textContent=saved?"♥ Guardado en favoritos":"♡ Guardar en favoritos"};
 sync();
 fav.addEventListener("click",async()=>{if(!currentUser){location.href="auth/login.html?next="+encodeURIComponent(location.pathname+location.search);return}fav.disabled=true;try{saved=await toggleFavorite(currentUser.uid,id);sync()}catch(e){alert("No pudimos actualizar tus favoritos.")}finally{fav.disabled=false}});
}
if(!id){root.innerHTML="<h1>Producto no encontrado</h1>";}
else {
 watchUser(async(user,profile)=>{
  currentUser=user||null;currentProfile=profile||null;authReady=true;
  try{
   const p=await fetchListing(id);
   const isOwner=!!(user&&p&&p.sellerId===user.uid);
   const isAdmin=!!(profile&&profile.role==="admin");
   if(!p||(p.status!=="approved"&&!isOwner&&!isAdmin)){
    root.innerHTML='<div class="empty-state"><h1>Esta publicación no está disponible</h1><p>Puede haber sido pausada o eliminada.</p><a class="btn-primary" href="index.html">Volver al catálogo</a></div>';
    return;
   }
   if(user){try{saved=(await fetchFavoriteIds(user.uid)).includes(id)}catch(e){}}
   render(p);
  }catch(e){
   console.error("Error al cargar la publicación:",e);
   root.innerHTML='<div class="empty-state"><h1>No pudimos cargar el producto</h1><p>Revisa tu conexión e inténtalo nuevamente.</p><a class="btn-primary" href="index.html">Volver al catálogo</a></div>';
  }
 });
}
</script></body></html>
