<!DOCTYPE html><html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis favoritos · Mercado Norte Sur</title><link rel="stylesheet" href="../assets/styles.css">
<style>.fav-wrap{padding-top:34px;padding-bottom:70px}.fav-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.fav-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.fav-card img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bg-subtle)}.fav-body{padding:14px}.fav-title{font-weight:700;min-height:38px}.fav-price{font-size:19px;font-weight:700;margin:8px 0}.fav-actions{display:flex;gap:8px}.fav-actions a,.fav-actions button{flex:1;text-align:center;padding:9px;border:1px solid var(--line);border-radius:7px;background:#fff;font-weight:600;font-size:12px}.fav-actions .remove{color:var(--rust)}@media(max-width:850px){.fav-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:460px){.fav-grid{gap:10px}.fav-body{padding:10px}}</style></head><body>
<header class="site"><div class="header-top"><a class="logo" href="../index.html"><span class="logo-mark"></span>Mercado Norte Sur</a><div class="header-actions"><a href="../index.html">Comprar</a><a href="dashboard.html">Mi cuenta</a></div></div></header>
<main class="wrap fav-wrap"><div class="section-head"><div><div class="eyebrow">Tu selección</div><h1>Mis favoritos</h1><p style="color:var(--ink-soft);margin-top:8px">Guarda aquí el equipamiento que te interesa y vuelve cuando quieras.</p></div></div><div id="favState" class="empty-state">Cargando tus favoritos…</div><div id="favGrid" class="fav-grid"></div></main>
<script type="module">
import {watchUser,fetchFavoriteListings,toggleFavorite,safeUrl,esc} from "../assets/firebase.js";
const state=document.getElementById("favState"),grid=document.getElementById("favGrid"),money=n=>"$"+Number(n||0).toLocaleString("es-CL");
watchUser(async user=>{
 if(!user){state.innerHTML='Para ver tus favoritos, <a href="../auth/login.html" style="color:var(--rust);font-weight:700">inicia sesión</a>.';return}
 try{
  const items=await fetchFavoriteListings(user.uid);
  if(!items.length){state.textContent="Todavía no tienes favoritos. Explora el catálogo y guarda los productos que te interesen.";return}
  state.style.display="none";
  grid.innerHTML=items.map(p=>'<article class="fav-card"><img src="'+esc(safeUrl(p.images?.[0]))+'" alt="'+esc(p.title)+'"><div class="fav-body"><div class="fav-title">'+esc(p.title)+'</div><div class="fav-price">'+money(p.price)+'</div><div style="font-size:12px;color:var(--ink-soft);margin-bottom:12px">'+esc(p.sellerName||"Vendedor")+' · '+esc(p.location||"")+'</div><div class="fav-actions"><a href="../producto.html?id='+encodeURIComponent(p.id)+'">Ver producto</a><button class="remove" data-remove="'+esc(p.id)+'">Quitar</button></div></div></article>').join("");
  grid.addEventListener("click",async e=>{const b=e.target.closest("[data-remove]");if(!b)return;b.disabled=true;try{await toggleFavorite(user.uid,b.dataset.remove);b.closest(".fav-card").remove();if(!grid.children.length){grid.innerHTML="";state.style.display="block";state.textContent="Todavía no tienes favoritos."}}catch(err){b.disabled=false;alert("No pudimos quitar el favorito.")}});
 }catch(e){state.textContent="No pudimos cargar tus favoritos. Revisa tu conexión e inténtalo nuevamente."}
});
</script></body></html>
