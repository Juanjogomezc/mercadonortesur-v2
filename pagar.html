<!DOCTYPE html><html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagar — Mercado Norte Sur</title><link rel="stylesheet" href="assets/styles.css">
<style>.bar{border-bottom:1px solid var(--line);padding:14px 0}.bar .wrap{display:flex;align-items:center;gap:16px}.bar nav{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:14px;font-weight:500}
main.wrap{padding-top:28px;padding-bottom:70px}.two{display:grid;grid-template-columns:1.1fr 1fr;gap:36px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.ph{aspect-ratio:1;border-radius:var(--radius);background:var(--bg-subtle) center/cover}.ord{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:10px 0}
.tg{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--forest-soft);color:var(--forest)}.tg.h{background:var(--amber-soft);color:var(--amber)}.msg{padding:10px 14px;border-radius:8px;background:var(--forest-soft);margin:12px 0}.msg.e{background:var(--red-soft);color:var(--red)}
.wp{max-width:420px;margin:40px auto;border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}</style></head><body>
<div class="bar"><div class="wrap"><a class="logo" href="index.html"><span class="logo-mark"></span>Mercado Norte Sur</a>
<nav id="nav"></nav></div></div><main class="wrap" id="app"></main>
<script src="assets/app.js"></script><script>
const B='';const u=MNS.me(),$=id=>document.getElementById(id);
$('nav').innerHTML=u?`<a href="${B}index.html">Comprar</a><a href="${B}cuenta/publicar.html">Vender</a><a href="${B}cuenta/pedidos.html">Mis pedidos</a><a href="#" onclick="MNS.logout();location.href='${B}index.html'">Salir</a>`:`<a href="${B}index.html">Comprar</a><a href="${B}auth/login.html">Entrar</a><a class="btn-primary" href="${B}auth/register.html">Crear cuenta</a>`;
const o=MNS.order(new URLSearchParams(location.search).get('o'));
if(!o||o.status!=='PENDING'){$('app').innerHTML='<h1>Pedido no disponible</h1>'}else{
$('app').innerHTML=`<div class="wp"><p class="eyebrow">Simulación de Webpay Plus</p><h2 style="margin:6px 0 12px">Pagar compra</h2><p>Comercio: Mercado Norte Sur<br>Monto: <b>${MNS.money(o.amount)}</b></p><p style="color:var(--ink-soft);font-size:14px">En producción aquí ingresas tu tarjeta en el sitio de Transbank.</p><button class="btn-primary" onclick="r(true)">Pagar</button> <button class="btn-ghost" onclick="r(false)">Anular compra</button></div>`}
function r(ok){MNS.pay(o.id,ok);location.href='cuenta/pedidos.html?m='+(ok?'ok':'no')}</script></body></html>
