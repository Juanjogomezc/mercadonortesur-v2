<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#27D3F5"><title>Artículo · Mercado Norte Sur</title><link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#F6F4EF;color:#1B1A17;font:16px/1.75 Roboto,Arial,sans-serif}.top{background:#fff;border-bottom:1px solid #E7E2D8;padding:16px 24px}.top a{font-weight:800;color:#1B1A17;text-decoration:none}.mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#27D3F5;color:white;margin-right:8px}.article{max-width:820px;margin:40px auto;padding:0 22px}.back{color:#00AFCF;font-weight:700;text-decoration:none}.paper{background:#fff;border:1px solid #E7E2D8;border-radius:14px;padding:28px;margin-top:18px}.cover{width:100%;max-height:420px;object-fit:cover;border-radius:10px}.cat{font-size:12px;font-weight:700;color:#00AFCF;text-transform:uppercase;letter-spacing:.1em}h1{font-size:40px;line-height:1.15;margin:10px 0} .meta{color:#96907F;font-size:13px}.excerpt{font-size:18px;color:#635E55}.content{white-space:pre-wrap;overflow-wrap:anywhere}.content a{color:#00AFCF}@media(max-width:600px){.article{margin:22px auto;padding:0 14px}.paper{padding:18px}h1{font-size:30px}}</style></head><body><div class="top"><a href="index.html"><span class="mark">▲</span>Mercado Norte Sur</a></div><main class="article"><a class="back" href="blog.html">← Volver al Blog</a><div id="article"><div class="paper">Cargando artículo…</div></div></main>
<script type="module">
import {fetchPublishedBlogPost,safeUrl,esc} from "./assets/firebase.js";
const root=document.getElementById("article"),slug=new URLSearchParams(location.search).get("slug");
try{const p=await fetchPublishedBlogPost(slug);if(!p)throw new Error("not-found");document.title=p.title+" · Mercado Norte Sur";const body=esc(p.content||"").replace(/(https:\/\/[^\\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');const d=p.publishedAt?.toDate?p.publishedAt.toDate():p.publishedAt?new Date(p.publishedAt):null;root.innerHTML='<article class="paper">'+(safeUrl(p.coverImage)?'<img class="cover" src="'+esc(p.coverImage)+'" alt="'+esc(p.title)+'">':'')+'<p class="cat">'+esc(p.category||"Blog")+'</p><h1>'+esc(p.title)+'</h1><div class="meta">'+(d&&!Number.isNaN(d.getTime())?d.toLocaleDateString("es-CL"):"")+' · '+Math.max(1,Number(p.readingTime)||1)+' min de lectura</div><p class="excerpt">'+esc(p.excerpt||"")+'</p><hr><div class="content">'+body+'</div></article>';}catch(e){root.innerHTML='<div class="paper"><h1>Artículo no disponible</h1><p>Este contenido no existe o ya no está publicado.</p><a class="back" href="blog.html">Volver al Blog</a></div>';}
</script></body></html>
