<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#27D3F5">
  <meta name="robots" content="index,follow">
  <meta name="description" content="Lee este artículo en el Blog de Mercado Norte Sur.">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Mercado Norte Sur">
  <meta property="og:title" content="Artículo | Mercado Norte Sur">
  <meta property="og:description" content="Lee este artículo en el Blog de Mercado Norte Sur.">
  <meta name="twitter:card" content="summary_large_image">
  <title>Artículo | Mercado Norte Sur</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#F6F4EF;color:#1B1A17;font:16px/1.75 Roboto,Arial,sans-serif}
    .top{background:#fff;border-bottom:1px solid #E7E2D8;padding:16px 24px}
    .top a{font-weight:800;color:#1B1A17;text-decoration:none;display:inline-flex;align-items:center}
    .mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#27D3F5;color:#fff;margin-right:8px}
    .article{max-width:820px;margin:40px auto;padding:0 22px}
    .back{color:#00AFCF;font-weight:700;text-decoration:none}
    .back:focus-visible,.content a:focus-visible{outline:3px solid #27D3F5;outline-offset:3px}
    .paper{background:#fff;border:1px solid #E7E2D8;border-radius:14px;padding:clamp(18px,4vw,32px);margin-top:18px}
    .cover{display:block;width:100%;max-height:440px;object-fit:cover;border-radius:10px}
    .cat{font-size:12px;font-weight:700;color:#00AFCF;text-transform:uppercase;letter-spacing:.1em}
    h1{font-size:clamp(30px,5vw,42px);line-height:1.15;margin:10px 0}
    .meta{color:#96907F;font-size:13px}
    .excerpt{font-size:18px;color:#635E55}
    .content{white-space:pre-wrap;overflow-wrap:anywhere}
    .content a{color:#008EAA;text-decoration:underline;text-underline-offset:2px}
    @media(max-width:600px){.article{margin:22px auto;padding:0 14px}.top{padding:14px 16px}}
  </style>
</head>
<body>
  <div class="top"><a href="index.html"><span class="mark" aria-hidden="true">▲</span>Mercado Norte Sur</a></div>
  <main class="article">
    <a class="back" href="blog.html">← Volver al Blog</a>
    <div id="article" aria-live="polite"><div class="paper">Cargando artículo…</div></div>
  </main>
  <script type="module">
    import {fetchPublishedBlogPost,safeUrl} from "./assets/firebase.js";
    const root=document.getElementById("article");
    const slug=new URLSearchParams(location.search).get("slug");
    const fallbackDescription="Lee este artículo en el Blog de Mercado Norte Sur.";
    function setMeta(selector,attribute,value){
      let node=document.head.querySelector(selector);
      if(!node){node=document.createElement("meta");const parts=selector.match(/\[(name|property)="([^"]+)"\]/);node.setAttribute(parts[1],parts[2]);document.head.appendChild(node);}
      node.setAttribute("content",value);
    }
    function addText(parent,tag,className,value){
      const node=document.createElement(tag);
      if(className)node.className=className;
      node.textContent=value||"";
      parent.appendChild(node);
      return node;
    }
    function renderContent(parent,value){
      const text=String(value||"");
      const pattern=/https:\/\/[^\s<>"']+/g;
      let cursor=0,match;
      while((match=pattern.exec(text))){
        let raw=match[0],urlText=raw;
        while(/[.,!?;:)}\]]$/.test(urlText))urlText=urlText.slice(0,-1);
        if(match.index>cursor)parent.appendChild(document.createTextNode(text.slice(cursor,match.index)));
        let parsed=null;
        try{parsed=new URL(urlText);}catch(_){}
        if(parsed&&parsed.protocol==="https:"){
          const link=document.createElement("a");
          link.href=parsed.href;link.textContent=urlText;link.target="_blank";link.rel="noopener noreferrer";
          parent.appendChild(link);
        }else parent.appendChild(document.createTextNode(urlText));
        if(raw.length>urlText.length)parent.appendChild(document.createTextNode(raw.slice(urlText.length)));
        cursor=match.index+raw.length;
      }
      if(cursor<text.length)parent.appendChild(document.createTextNode(text.slice(cursor)));
    }
    function unavailable(){
      document.querySelector('meta[name="robots"]')?.setAttribute("content","noindex,nofollow");
      root.replaceChildren();
      const panel=document.createElement("div");panel.className="paper";
      addText(panel,"h1","", "Artículo no disponible");
      addText(panel,"p","","Este contenido no existe o ya no está publicado.");
      const back=document.createElement("a");back.className="back";back.href="blog.html";back.textContent="Volver al Blog";panel.appendChild(back);
      root.appendChild(panel);
    }
    try{
      const post=await fetchPublishedBlogPost(slug);
      if(!post)throw new Error("not-found");
      const title=String(post.title||"Artículo");
      const description=String(post.excerpt||fallbackDescription).replace(/\s+/g," ").slice(0,300);
      const canonical=location.href.split("#")[0];
      document.title=title+" | Blog Mercado Norte Sur";
      setMeta('meta[name="description"]',"name",description);
      setMeta('meta[property="og:title"]',"property",title+" | Mercado Norte Sur");
      setMeta('meta[property="og:description"]',"property",description);
      setMeta('meta[property="og:url"]',"property",canonical);
      setMeta('meta[name="twitter:title"]',"name",title+" | Mercado Norte Sur");
      setMeta('meta[name="twitter:description"]',"name",description);
      const cover=safeUrl(post.coverImage);
      if(cover){
        setMeta('meta[property="og:image"]',"property",cover);
        setMeta('meta[name="twitter:image"]',"name",cover);
      }
      let canonicalLink=document.querySelector('link[rel="canonical"]');
      if(!canonicalLink){canonicalLink=document.createElement("link");canonicalLink.rel="canonical";document.head.appendChild(canonicalLink);}
      canonicalLink.href=canonical;
      const publishedDate=post.publishedAt||post.createdAt||post.updatedAt;
      const date=publishedDate?.toDate?publishedDate.toDate():publishedDate?new Date(publishedDate):null;
      const article=document.createElement("article");article.className="paper";
      if(cover){const img=document.createElement("img");img.className="cover";img.src=cover;img.alt=title;img.loading="eager";article.appendChild(img);}
      addText(article,"p","cat",post.category||"Blog");
      addText(article,"h1","",title);
      addText(article,"div","meta",(date&&!Number.isNaN(date.getTime())?date.toLocaleDateString("es-CL"):"")+" · "+Math.max(1,Number(post.readingTime)||1)+" min de lectura");
      addText(article,"p","excerpt",post.excerpt||"");
      article.appendChild(document.createElement("hr"));
      const content=document.createElement("div");content.className="content";renderContent(content,post.content);article.appendChild(content);
      root.replaceChildren(article);
      const schema={
        "@context":"https://schema.org","@type":"Article",
        "headline":title,"description":description,
        "image":cover?[cover]:undefined,
        "datePublished":date&&!Number.isNaN(date.getTime())?date.toISOString():undefined,
        "author":{"@type":"Organization","name":post.authorName||"Mercado Norte Sur"},
        "publisher":{"@type":"Organization","name":"Mercado Norte Sur"},
        "mainEntityOfPage":canonical
      };
      const jsonLd=document.createElement("script");jsonLd.type="application/ld+json";jsonLd.textContent=JSON.stringify(schema);document.head.appendChild(jsonLd);
    }catch(error){console.warn("No se pudo cargar el artículo:",error);unavailable();}
  </script>
</body>
</html>
